<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Fantasy football wizard</title>
  <desc id="desc">A flat-color vector illustration of a blue-robed wizard running with a football while players chase him and a dragon flies over a stadium.</desc>
