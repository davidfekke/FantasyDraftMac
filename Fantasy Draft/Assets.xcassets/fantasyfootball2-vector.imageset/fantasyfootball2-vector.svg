    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#657b36"/><stop offset="1" stop-color="#294b2e"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183e4c"/><stop offset="1" stop-color="#071f2a"/></linearGradient>
    <style>
